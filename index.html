    <script>
      // Prevent FOUC for dark mode
      try {
        const t = localStorage.getItem('ag-theme');
        if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    </script>
